                                                </div>
                                                <span className="text-xl font-bold text-emerald-400">{modelMetrics ? modelMetrics.matrix.tn : 101}</span>
                                                <span className="text-[8px] text-slate-500 leading-none">Normal traffic classified correctly</span>
                                            </div>

                                            {/* FP (False Positive) */}
                                            <div className="bg-red-950/10 hover:bg-red-950/20 border border-red-500/20 rounded-xl p-4 flex flex-col justify-between h-24 transition-colors">
                                                <div className="flex justify-between items-start text-red-500">
                                                    <span className="text-[10px] font-bold">FP</span>
                                                    <span className="bg-red-500/10 text-[9px] px-1 py-0.2 rounded font-sans font-bold">ERROR</span>
                                                </div>
                                                <span className="text-xl font-bold text-red-400">{modelMetrics ? modelMetrics.matrix.fp : 3}</span>
                                                <span className="text-[8px] text-slate-500 leading-none">Normal misidentified as Intrusion</span>
                                            </div>

                                            {/* FN (False Negative) */}
                                            <div className="bg-red-950/10 hover:bg-red-950/20 border border-red-500/20 rounded-xl p-4 flex flex-col justify-between h-24 transition-colors">
                                                <div className="flex justify-between items-start text-red-500">
                                                    <span className="text-[10px] font-bold">FN</span>
                                                    <span className="bg-red-500/10 text-[9px] px-1 py-0.2 rounded font-sans font-bold">ERROR</span>
                                                </div>
                                                <span className="text-xl font-bold text-red-400">{modelMetrics ? modelMetrics.matrix.fn : 2}</span>
                                                <span className="text-[8px] text-slate-500 leading-none">Malicious bypass undetected</span>
                                            </div>

                                            {/* TP (True Positive) */}
                                            <div className="bg-emerald-950/20 hover:bg-emerald-950/30 border border-emerald-500/20 rounded-xl p-4 flex flex-col justify-between h-24 transition-colors">
                                                <div className="flex justify-between items-start text-emerald-500">
                                                    <span className="text-[10px] font-bold">TP</span>
                                                    <span className="bg-emerald-500/10 text-[9px] px-1 py-0.2 rounded font-sans font-bold">CORRECT</span>
                                                </div>
                                                <span className="text-xl font-bold text-emerald-400">{modelMetrics ? modelMetrics.matrix.tp : 74}</span>
                                                <span className="text-[8px] text-slate-500 leading-none">Intrusion flagged successfully</span>
                                            </div>

                                        </div>
                                    </div>

                                    {/* Summary findings card */}
                                    <div className="bg-slate-900 p-3.5 rounded-lg border border-slate-850 text-[11px] leading-relaxed text-slate-300">
                                        <p>
                                            <strong className="text-teal-400 font-semibold">Inference Summary:</strong> The model exhibits negligible cross-classification leakage. A low false negative ($FN$) rate ensures high defensive reliability, whilst minimized false alarms ($FP$) prevent system notification overload.
                                        </p>
                                        <button onClick={() => setCurrentPhase(5)} className="mt-3 w-full text-center py-2 bg-slate-950 hover:bg-slate-800 text-teal-400 text-xs border border-teal-500/20 hover:border-teal-400 rounded-lg font-bold transition-all cursor-pointer">
                                            Deploy to Multi-Threat Detection Terminal &rarr;
                                        </button>
                                    </div>
                                </div>

                            </div>
                        </div>
                    )}

                    {/* PHASE 05: MULTI-THREAT PRODUCTION DETECTION TERMINAL */}
                    {currentPhase === 5 && (
                        <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-6">
                            
                            {/* Panel Header */}
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-5">
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h3 className="text-base font-bold text-slate-200">Phase 05: Multi-Threat Production Detection Terminal</h3>
                                        <span className="px-2 py-0.5 rounded text-[9px] bg-red-500/15 text-red-400 font-black tracking-widest uppercase animate-pulse">Live Engine</span>
                                    </div>
                                    <p className="text-xs text-slate-400 mt-1">Upload a comprehensive mixed dataset to automatically classify and map all concurrent attack vectors chronologically.</p>
                                </div>

                                <div className="flex flex-wrap gap-2">
                                    <button 
                                        onClick={seedMultiThreatDemo}
                                        className="px-3.5 py-2 bg-slate-950 hover:bg-slate-800 border border-teal-500/40 hover:border-teal-400 text-teal-400 text-xs font-bold rounded-xl transition-all cursor-pointer"
                                    >
                                        Seed Multi-Threat Test Log
                                    </button>
                                    <input 
                                        type="file" 
                                        accept=".csv,.txt,.log,.json" 
                                        id="multi-threat-upload" 
                                        onChange={handleMultiThreatUpload}
                                        className="hidden"
                                    />
                                    <label 
                                        htmlFor="multi-threat-upload"
                                        className="px-3.5 py-2 bg-teal-500 hover:bg-teal-400 text-slate-950 text-xs font-bold rounded-xl transition-all cursor-pointer block text-center"
                                    >
                                        {isAnalyzingMultiThreat ? 'Processing Engine...' : 'Upload Mixed Threat Log'}
                                    </label>
                                </div>
                            </div>

                            {/* Error warning banner */}
                            {activeMultiThreatError && (
                                <div className="bg-red-950/30 border border-red-500/40 text-red-400 p-3 rounded-lg text-xs font-mono">
                                    ❌ {activeMultiThreatError}
                                </div>
                            )}

                            {/* Telemetry metadata block */}
                            {multiThreatMetadata && (
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-850 flex flex-wrap gap-6 items-center text-xs font-mono justify-between text-slate-400">
                                    <div className="flex items-center gap-4">
                                        <span className="text-teal-400 font-bold block">Active Log:</span>
                                        <span>📄 {multiThreatMetadata.name}</span>
                                        <span>Size: {multiThreatMetadata.size}</span>
                                        <span>Total Rows: {multiThreatMetadata.count} messages</span>
                                        <span>Analysis Window: {windowSize} steps</span>
                                    </div>

                                    {/* Dynamic State Alert Badge */}
                                    {(() => {
                                        const anomaliesCount = multiThreatLogList.filter(l => l.label !== 'Normal').length;
                                        const severityLevel = anomaliesCount > 10 ? 'CRITICAL' : anomaliesCount > 0 ? 'WARNING' : 'SECURE';
                                        return (
                                            <span className={`px-3 py-1 rounded text-xs font-extrabold flex items-center gap-1.5 ${
                                                severityLevel === 'CRITICAL' ? 'bg-red-500/10 text-red-400 border border-red-500/30' :
                                                severityLevel === 'WARNING' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/30' :
                                                'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30'
                                            }`}>
                                                <span className={`h-2.5 w-2.5 rounded-full inline-block ${
                                                    severityLevel === 'CRITICAL' ? 'bg-red-500 animate-ping' :
                                                    severityLevel === 'WARNING' ? 'bg-amber-500 animate-pulse' :
                                                    'bg-emerald-500'
                                                }`}></span>
                                                NETWORK STATUS: {severityLevel} ({anomaliesCount} Intrusion Blocks)
                                            </span>
                                        );
                                    })()}
                                </div>
                            )}

                            {/* Main telemetry analytics results */}
                            {multiThreatLogList.length > 0 ? (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    
                                    {/* Threat Classification Breakdown */}
                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-850 flex flex-col justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-slate-400 uppercase tracking-wider font-mono">Incident Classification Distribution</span>
                                            <p className="text-[10px] text-slate-500 mt-0.5">Statistical tally of analyzed window blocks.</p>
                                        </div>

                                        {/* SVG Bar chart */}
                                        <div className="space-y-4 my-5 font-mono text-xs">
                                            {[
                                                { label: 'Normal Base Log', value: multiThreatDistributions['Normal'], color: 'from-emerald-600 to-emerald-400', themeText: 'text-emerald-400' },
                                                { label: 'DoS Flooding Attack', value: multiThreatDistributions['DoS Attack'], color: 'from-red-600 to-red-400', themeText: 'text-red-400' },
                                                { label: 'Gear Transmission Spoof', value: multiThreatDistributions['Gear Spoofing'], color: 'from-amber-600 to-amber-400', themeText: 'text-amber-400' },
                                                { label: 'Fuzzy Boundary Attack', value: multiThreatDistributions['Fuzzy Attack'], color: 'from-cyan-600 to-cyan-400', themeText: 'text-cyan-400' },
                                                { label: 'RPM Counter Spoofing', value: multiThreatDistributions['RPM Spoofing'], color: 'from-purple-600 to-purple-400', themeText: 'text-purple-400' }
                                            ].map((item, idx) => {
                                                const totalCount = multiThreatLogList.length;
                                                const percentage = totalCount > 0 ? ((item.value / totalCount) * 100) : 0;
                                                return (
                                                    <div key={idx} className="space-y-1.5">
                                                        <div className="flex justify-between text-[11px]">
                                                            <span className="text-slate-400">{item.label}</span>
                                                            <span className={`font-bold ${item.themeText}`}>{item.value} block(s) ({percentage.toFixed(1)}%)</span>
                                                        </div>
                                                        <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                                                            <div 
                                                                style={{ width: `${item.value > 0 ? Math.max(percentage, 6) : 0}%` }} 
                                                                className={`bg-gradient-to-r ${item.color} h-full rounded-full transition-all duration-500`}
                                                            />
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <div className="bg-slate-900 p-3 rounded border border-slate-850 text-[10px] text-slate-500 leading-normal">
                                            The automatic threat segment separator uses classification trees to continuously process sequential sliding window data frames.
                                        </div>
                                    </div>

                                    {/* Continuous Interactive Log Timeline & Search */}
                                    <div className="md:col-span-2 bg-slate-950 p-4 rounded-xl border border-slate-850 flex flex-col h-full space-y-4">
                                        
                                        {/* Filters header bar */}
                                        <div className="flex flex-wrap justify-between items-center gap-2">
                                            <div>
                                                <span className="text-xs font-bold text-slate-400 uppercase tracking-wider font-mono">Telemetry Security Incident Timeline</span>
                                                <p className="text-[10px] text-slate-500">Chronological analysis derived from classifier outputs.</p>
                                            </div>

                                            {/* Filters Buttons Row */}
                                            <div className="flex flex-wrap gap-1 font-mono text-[9px]">
                                                {[
                                                    { code: 'ALL', text: 'ALL' },
                                                    { code: 'ANOMALIES', text: 'ANOMALIES ONLY' },
                                                    { code: 'Normal', text: 'NORMAL' },
                                                    { code: 'DoS Attack', text: 'DoS' },
                                                    { code: 'Gear Spoofing', text: 'GEAR' },
                                                    { code: 'Fuzzy Attack', text: 'FUZZY' },
                                                    { code: 'RPM Spoofing', text: 'RPM' }
                                                ].map((btn) => (
                                                    <button 
                                                        key={btn.code}
                                                        onClick={() => setSelectedThreatFilter(btn.code)}
                                                        className={`px-2 py-1 rounded font-bold border transition-all cursor-pointer ${
                                                            selectedThreatFilter === btn.code 
                                                                ? 'bg-teal-500 text-slate-950 border-teal-400' 
                                                                : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200'
                                                        }`}
                                                    >
                                                        {btn.text}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Table timeline view */}
                                        <div className="overflow-y-auto max-h-72 border border-slate-850 rounded-lg bg-slate-900/40">
                                            <table className="w-full text-left border-collapse font-mono text-[11px]">
                                                <thead className="bg-slate-950 text-slate-400 sticky top-0 border-b border-slate-850 z-10">
                                                    <tr>
                                                        <th className="p-2.5">Time</th>
                                                        <th className="p-2.5">Threat Class</th>
                                                        <th className="p-2.5">Target Node</th>
                                                        <th className="p-2.5">Entropy ($H$)</th>
                                                        <th className="p-2.5">Severity</th>
                                                        <th className="p-2.5">Diagnostic Signal Summary</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-900">
                                                    {filteredMultiThreatLogs.map((log) => (
                                                        <tr key={log.id} className="hover:bg-slate-900/60 transition-colors">
                                                            <td className="p-2 text-slate-500 font-bold">{log.timestamp}</td>
                                                            <td className="p-2">
                                                                <span className={`px-1.5 py-0.5 rounded text-[10px] font-sans font-bold ${
                                                                    log.label === 'Normal' ? 'bg-emerald-500/15 text-emerald-400' :
                                                                    log.label === 'DoS Attack' ? 'bg-red-500/15 text-red-400' :
                                                                    log.label === 'Gear Spoofing' ? 'bg-amber-500/15 text-amber-400' :
                                                                    log.label === 'Fuzzy Attack' ? 'bg-cyan-500/15 text-cyan-400' :
                                                                    'bg-purple-500/15 text-purple-400'
                                                                }`}>
                                                                    {log.label}
                                                                </span>
                                                            </td>
                                                            <td className="p-2 text-slate-400 font-bold">{log.dominantId}</td>
                                                            <td className="p-2 text-teal-400">{log.entropy}</td>
                                                            <td className="p-2">
                                                                <span className={`text-[9px] font-extrabold tracking-wide ${
                                                                    log.severity === 'CRITICAL' ? 'text-red-400 animate-pulse' :
                                                                    log.severity === 'WARNING' ? 'text-amber-400' :
                                                                    'text-emerald-400'
                                                                }`}>
                                                                    {log.severity}
                                                                </span>
                                                            </td>
                                                            <td className="p-2 text-slate-500 text-[10px] max-w-[220px] truncate" title={log.description}>
                                                                {log.description}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    {filteredMultiThreatLogs.length === 0 && (
                                                        <tr>
                                                            <td colSpan="6" className="text-center p-8 text-slate-600">
                                                                No telemetry window sequences found matching selected filter scope.
                                                            </td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="flex justify-between items-center text-[10px] text-slate-500 font-mono">
                                            <span>Showing {filteredMultiThreatLogs.length} of {multiThreatLogList.length} logs</span>
                                            <span className="text-teal-400">Analysis Rate: ~12.5k messages/sec</span>
                                        </div>

                                    </div>

                                </div>
                            ) : (
                                <div className="text-center py-16 border border-dashed border-slate-800 rounded-xl bg-slate-950/25 space-y-4">
                                    <div className="mx-auto w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-500 text-lg">📁</div>
                                    <div className="space-y-1">
                                        <p className="text-sm font-bold text-slate-400">No multi-threat log analysis compiled in session memory.</p>
                                        <p className="text-xs text-slate-500 max-w-md mx-auto">Upload a mixed CAN log, or click the sample button to generate a comprehensive sequential attack scenario.</p>
                                    </div>
                                    <button 
                                        onClick={seedMultiThreatDemo}
                                        className="px-4 py-2 bg-gradient-to-r from-teal-500 to-emerald-600 text-slate-950 text-xs font-bold rounded-lg hover:brightness-110 transition-all cursor-pointer"
                                    >
                                        Seed Multi-Threat Test Log
                                    </button>
